<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Editor - wbtl.app</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23475569'/><stop offset='100%25' stop-color='%23334155'/></linearGradient></defs><rect width='24' height='24' rx='4' fill='url(%23g)'/><path d='M3 17V7l3.5 5L10 7v10' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M16 7v10' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><path d='M13 14l3 3 3-3' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <div class="header-left">
      <div class="tool-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17V7l3.5 5L10 7v10"/>
          <path d="M16 7v10"/>
          <path d="M13 14l3 3 3-3" fill="none"/>
        </svg>
      </div>
      <div class="tool-name">Markdown Editor</div>
      <input
        id="docName"
        class="doc-name"
        type="text"
        value="Untitled"
        aria-label="Document name"
        spellcheck="false"
      />
    </div>
    <div class="header-right">
      <div class="actions">
        <button id="uploadBtn" class="btn" title="Upload file (Ctrl+O)" aria-label="Upload file">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span>Upload</span>
        </button>
        <input id="fileInput" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>

        <button id="saveBtn" class="btn" title="Save (Ctrl+S)" aria-label="Save document">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          <span>Save</span>
        </button>

        <div class="dropdown">
          <button class="btn" data-toggle="exportMenu" aria-haspopup="true" aria-expanded="false">
            <span>Export</span>
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div id="exportMenu" class="dropdown-menu" role="menu">
            <button class="menu-item" data-action="export-md" role="menuitem">Export as Markdown (.md)</button>
            <button class="menu-item" data-action="export-html" role="menuitem">Export as HTML (.html)</button>
          </div>
        </div>

        <div class="dropdown">
          <button class="btn" data-toggle="copyMenu" aria-haspopup="true" aria-expanded="false">
            <span>Copy</span>
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div id="copyMenu" class="dropdown-menu" role="menu">
            <button class="menu-item" data-action="copy-md" role="menuitem">Copy Markdown</button>
            <button class="menu-item" data-action="copy-html" role="menuitem">Copy HTML</button>
          </div>
        </div>

        <button id="docsBtn" class="btn" title="Documents" aria-label="Toggle documents panel">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span>Documents</span>
        </button>

        <button id="viewBtn" class="btn icon-btn" title="Toggle view (Ctrl+E)" aria-label="Toggle view mode">
          <svg id="viewIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="12" y1="3" x2="12" y2="21"/>
          </svg>
        </button>
      </div>

      <div class="theme-toggle" title="Toggle theme">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <div class="toggle-switch" id="themeToggle" role="button" tabindex="0" aria-label="Toggle dark mode"></div>
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="currentColor">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </div>
    </div>
  </header>

  <main id="workspace" data-view="split">
    <div class="editor-pane" id="editorPane">
      <textarea
        id="editor"
        spellcheck="false"
        placeholder="# Start writing markdown…&#10;&#10;Type or drop a .md file here."
        aria-label="Markdown source editor"
      ></textarea>
    </div>
    <div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="Resize panes" tabindex="0"></div>
    <div class="preview-pane" id="previewPane">
      <article id="preview" class="markdown-body" aria-label="Rendered preview"></article>
    </div>
  </main>

  <footer>
    <div class="footer-left">
      <span id="wordCount">0 words</span>
      <span class="dot">·</span>
      <span id="charCount">0 characters</span>
    </div>
    <div class="footer-right">
      <span id="saveStatus" class="save-status">Ready</span>
    </div>
  </footer>

  <!-- Documents panel -->
  <div id="docsPanel" class="docs-panel" aria-hidden="true">
    <div class="docs-panel-header">
      <h2>Documents</h2>
      <button id="docsCloseBtn" class="btn icon-btn" aria-label="Close documents panel">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="docs-panel-actions">
      <button id="newDocBtn" class="btn primary">New document</button>
    </div>
    <ul id="docsList" class="docs-list"></ul>
  </div>
  <div id="docsBackdrop" class="docs-backdrop" aria-hidden="true"></div>

  <!-- Drag overlay -->
  <div id="dropOverlay" class="drop-overlay" aria-hidden="true">
    <div class="drop-message">
      <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <p>Drop a .md file to open</p>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
